<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>URL Shortener</title>
</head>
<body>

<button id="theme-toggle" type="button">Light Mode</button>

<div class="container">
    <h2>URL Shortener</h2>
    <div id="errorMsg" class="error"></div>
    
    <input type="url" id="longLink" placeholder="Paste your long link here" required>
    
    <input type="text" id="customLink" placeholder="Custom Link (optional)">
    
    <select id="expiryTime">
        <option value="">Never expire</option>
        <option value="1">Expire in 1 Hour</option>
        <option value="24">Expire in 24 Hours</option>
        <option value="168">Expire in 7 Days</option>
    </select>

    <button onclick="shortenUrl()">Shorten</button>
    
    <div id="result"></div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
